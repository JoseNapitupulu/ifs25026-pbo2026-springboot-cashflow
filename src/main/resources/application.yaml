spring:
  application:
    name: ifs25026-pbo2026-springboot-cashflow
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  # PORT dipakai platform hosting (mis. Render) yang menyuntikkan port sendiri;
  # APP_PORT tetap dipakai saat pengembangan lokal lewat .env.
  port: ${PORT:${APP_PORT:8080}}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
